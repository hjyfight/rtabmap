grid_projection:
  ros__parameters:
    map_frame: map
    cloud_topic: /cloud_map
    update_interval: 1.0
    resolution: 0.05
    # Heights relative to the fitted floor, not the lidar origin or map z=0.
    min_obstacle_height: 0.15
    max_obstacle_height: 1.6
    ground_tolerance: 0.07
    max_ground_tilt: 20.0
    min_sensor_height: 0.10
    max_sensor_height: 1.8
    floor_min_points: 100
    floor_min_area: 1.0
    noise_radius: 0.12
    noise_min_neighbors: 3
    max_cells: 4000000
