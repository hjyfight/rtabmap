<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RTAB-Map · 实时建图展示</title>
<style>
  *{box-sizing:border-box}body{margin:0;background:#101821;color:#eaf1f7;font:16px/1.7 system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;padding:28px}
  main{max-width:820px;width:100%}.eyebrow{letter-spacing:.16em;color:#55d7c3;font-size:12px}h1{font-size:clamp(30px,5vw,48px);line-height:1.2;margin:18px 0}p{color:#aabac8}
  .panels{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:32px 0}.card{border:1px solid #2c3b49;border-radius:12px;padding:20px 15px;background:#16222d}.card b{display:block;font-size:16px}.card small{color:#91a6b8}
  button,a{font:inherit}button{border:0;border-radius:8px;background:#55d7c3;color:#0d2220;font-weight:650;padding:12px 24px;cursor:pointer}button:disabled{opacity:.6}a{color:#c1d5e5;margin-left:20px}.note{font-size:13px;margin-top:25px}.status{font-size:14px;color:#55d7c3;min-height:24px}
  @media(max-width:650px){.panels{grid-template-columns:repeat(2,1fr)}a{display:block;margin:16px 0}}
</style>
<main>
  <div class="eyebrow">RTAB-MAP × MITI</div>
  <h1>实时建图，一屏呈现。</h1>
  <p>上方并排查看三维点云、二维栅格地图与 RealSense 画面，下方查看回环日志和检测状态。</p>
  <div class="panels">
    <div class="card"><b>三维地图</b><small>墙面 · 位姿 · 标签 · 隐藏顶部</small></div>
    <div class="card"><b>二维栅格</b><small>地面识别 · 高度筛选 · 俯视地图</small></div>
    <div class="card"><b>彩色画面</b><small>RealSense 实时图像</small></div>
    <div class="card"><b>对齐深度</b><small>空间距离与有效范围</small></div>
    <div class="card"><b>回环监控</b><small>实时状态面板 · 详细日志</small></div>
  </div>
  <button id="refresh">更新显示并保留当前布局</button>
  <p><button id="apply">应用完整项目布局</button><a href="/">直接进入 →</a></p>
  <p class="note">已有栅格窗口会更新为过滤高处结构后的地图，保留视角。首次添加时会复用三维地图旁的空白场景。相机、日志与三维地图设置继续保留。首次使用请选择“应用完整项目布局”。操作前会在当前浏览器中备份已有配置。</p>
  <div class="status" id="status" role="status"></div>
</main>
<script>
let entering = false;
async function enter(applyLayout) {
  if (entering) return;
  entering = true;
  const buttons = ['apply', 'refresh'].map(id => document.getElementById(id));
  const status = document.getElementById('status');
  buttons.forEach(button => { button.disabled = true; });
  status.textContent = '正在更新地图控件…';
  try {
    let layout;
    if (applyLayout) {
      const response = await fetch('/rtabmap-layout.json', {cache: 'no-store'});
      if (!response.ok) throw new Error('无法读取项目布局');
      layout = await response.json();
    }
    // Refresh the pinned MITI extension before navigating to a layout using its new panel type.
    const manifestResponse = await fetch('/rtabmap-panel-assets.json', {cache: 'no-store'});
    if (!manifestResponse.ok) throw new Error('项目显示控件尚未安装，请重新运行 MITI 启动脚本');
    const manifest = await manifestResponse.json();
    if (!Array.isArray(manifest.assets) || !manifest.assets.length) throw new Error('显示控件资源清单无效');
    await Promise.all(manifest.assets.map(async path => {
      if (typeof path !== 'string' || !path.startsWith('/_next/static/chunks/')) {
        throw new Error('显示控件资源地址无效');
      }
      const asset = await fetch(path, {cache: 'reload'});
      if (!asset.ok) throw new Error('无法加载显示控件，请刷新后重试');
      await asset.arrayBuffer();
    }));
    const keys = ['miti_layout_config', 'miti_bridge_url', 'miti_stream_mode'];
    const previous = Object.fromEntries(keys.map(key => [key, localStorage.getItem(key)]));
    localStorage.setItem('rtabmap_miti_backup_' + Date.now(), JSON.stringify(previous));
    if (applyLayout) {
      localStorage.setItem('miti_layout_config', JSON.stringify(layout));
      localStorage.setItem('miti_stream_mode', JSON.stringify('synchronized'));
      // Let the server announce its bridge port, including automatic fallbacks.
      localStorage.removeItem('miti_bridge_url');
    }
    location.assign('/?rtabmap_ui=' + encodeURIComponent(manifest.version || 'current'));
  } catch (error) {
    status.textContent = '显示未更新：' + error.message;
    buttons.forEach(button => { button.disabled = false; });
    entering = false;
  }
}
document.getElementById('apply').addEventListener('click', () => enter(true));
document.getElementById('refresh').addEventListener('click', () => enter(false));
if (new URLSearchParams(location.search).get('refresh') === '1') enter(false);
</script>
</html>
