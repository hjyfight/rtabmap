semantic_mapper:
  ros__parameters:
    device: cpu
    image_size: 640
    cpu_threads: 2
    confidence: 0.5
    min_depth: 0.3
    max_depth: 4.0
    min_depth_points: 30
    min_observations: 3
    association_distance: 0.45
    max_observations: 30
    dynamic_classes: [person, cat, dog]
    dynamic_ttl: 3.0
    classes: ['*']
