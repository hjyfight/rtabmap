semantic_mapper:
  ros__parameters:
    device: cpu
    image_size: 640
    cpu_threads: 2
    confidence: 0.45
    label_language: zh
    min_depth: 0.3
    max_depth: 4.0
    min_depth_points: 30
    # Confirm in 4 of the latest 6 processed keyframes; keep confirmed static labels.
    min_observations: 4
    confirmation_window: 6
    dynamic_min_observations: 2
    association_distance: 0.45
    max_observations: 30
    dynamic_classes: [person, cat, dog]
    dynamic_ttl: 3.0
    # Allow all checkpoint categories. This is a post-inference filter, not a prompt.
    classes: ['*']
